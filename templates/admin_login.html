<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin login — S21 Luton</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Bebas+Neue&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}">
</head>
<body class="admin-page">
  <div class="admin-auth-wrap">
    <form class="admin-card" method="post">
      <h1>Admin login</h1>
      {% with messages = get_flashed_messages() %}
        {% if messages %}
          <p class="admin-flash">{{ messages[0] }}</p>
        {% endif %}
      {% endwith %}
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autofocus required>
      <button type="submit" class="btn btn-primary">Log in</button>
    </form>
  </div>
</body>
</html>
