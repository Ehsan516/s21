<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit schedule — S21 Luton</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Bebas+Neue&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}">
</head>
<body class="admin-page">
  <div class="admin-wrap">
    <div class="admin-topbar">
      <h1>Edit schedule</h1>
      <div class="admin-topbar-actions">
        <a href="{{ url_for('index') }}" target="_blank" class="btn btn-ghost">View live site</a>
        <a href="{{ url_for('admin_logout') }}" class="btn btn-ghost">Log out</a>
      </div>
    </div>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <p class="admin-flash">{{ messages[0] }}</p>
      {% endif %}
    {% endwith %}

    <form method="post" id="scheduleForm">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="admin-table-wrap">
        <table class="admin-table" id="scheduleTable">
          <thead>
            <tr>
              <th>Day</th><th>Time</th><th>Class</th><th>Level</th><th>Badge</th><th>Badge text</th><th></th>
            </tr>
          </thead>
          <tbody id="scheduleBody">
            {% for row in schedule %}
            <tr>
              <td><input type="text" name="day" value="{{ row.day }}" required></td>
              <td><input type="text" name="time" value="{{ row.time }}" required></td>
              <td><input type="text" name="class_name" value="{{ row['class'] }}" required></td>
              <td><input type="text" name="level" value="{{ row.level }}"></td>
              <td>
                <select name="badge_type">
                  <option value="none" {{ 'selected' if not row.badge }}>None</option>
                  <option value="free" {{ 'selected' if row.badge and row.badge.type == 'free' }}>Free (highlight)</option>
                  <option value="coach" {{ 'selected' if row.badge and row.badge.type == 'coach' }}>Coach tag</option>
                  <option value="offsite" {{ 'selected' if row.badge and row.badge.type == 'offsite' }}>Off-site note</option>
                </select>
              </td>
              <td><input type="text" name="badge_text" value="{{ row.badge.text if row.badge else '' }}"></td>
              <td><button type="button" class="admin-row-remove" title="Remove row">&times;</button></td>
            </tr>
            {% endfor %}
          </tbody>
        </table>
      </div>

      <div class="admin-form-actions">
        <button type="button" id="addRow" class="btn btn-ghost">+ Add row</button>
        <button type="submit" class="btn btn-primary">Save schedule</button>
      </div>
    </form>
  </div>

  <template id="rowTemplate">
    <tr>
      <td><input type="text" name="day" required></td>
      <td><input type="text" name="time" required></td>
      <td><input type="text" name="class_name" required></td>
      <td><input type="text" name="level"></td>
      <td>
        <select name="badge_type">
          <option value="none" selected>None</option>
          <option value="free">Free (highlight)</option>
          <option value="coach">Coach tag</option>
          <option value="offsite">Off-site note</option>
        </select>
      </td>
      <td><input type="text" name="badge_text"></td>
      <td><button type="button" class="admin-row-remove" title="Remove row">&times;</button></td>
    </tr>
  </template>

  <script>
    document.getElementById('addRow').addEventListener('click', function () {
      var tpl = document.getElementById('rowTemplate');
      var clone = tpl.content.cloneNode(true);
      document.getElementById('scheduleBody').appendChild(clone);
    });

    document.getElementById('scheduleBody').addEventListener('click', function (e) {
      if (e.target.classList.contains('admin-row-remove')) {
        e.target.closest('tr').remove();
      }
    });
  </script>
</body>
</html>
